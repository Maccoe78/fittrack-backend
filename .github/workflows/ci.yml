name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble application
        run: ./gradlew assemble

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
            name: app-jar
            path: build/libs/*.jar

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Start Postgres with docker compose
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
            until docker exec fittrack-postgres pg_isready -U postgres -d fittrack_test; do
              sleep 2
            done

      - name: Run tests
        run: ./gradlew test jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml

      - name: Stop containers
        if: always()
        run: docker compose down

  sonar:
    name: Static analysis
    runs-on: [ self-hosted, x64, windows, sonar-pc ]
    continue-on-error: true
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: gradlew.bat sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=%SONAR_TOKEN%

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, educloud]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
            name: app-jar
            path: build/libs

      - name: Build docker image
        run: docker build -t fittrack-backend .


      - name: Ensure production database is running
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose -p fittrack -f docker-compose.prod.yaml up -d postgres

      - name: Deploy backend
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose -p fittrack -f docker-compose.prod.yaml up -d --no-deps --force-recreate api