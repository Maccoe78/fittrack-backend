name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble application
        run: ./gradlew assemble

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
            name: app-jar
            path: build/libs/*.jar

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Start Postgres with docker compose
        run: docker compose up -d postgres

      - name: Wait for Postgres
        run: |
            until docker exec fittrack-postgres pg_isready -U postgres -d fittrack_test; do
              sleep 2
            done

      - name: Run tests
        run: ./gradlew test

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
            name: app-jar
            path: build/libs

      - name: Build docker image
        run: docker build -t fittrack-backend .